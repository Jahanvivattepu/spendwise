```nginx
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API requests go to the Spring Boot container (Docker Compose service name "backend").
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # Single-page app: serve index.html for everything else.
    location / {
        try_files $uri /index.html;
    }
}
